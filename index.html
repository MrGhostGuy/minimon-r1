<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Minimon</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;max-width:100vw;max-height:100vh}
#err{position:fixed;bottom:4px;left:4px;right:4px;color:#f44;font:10px monospace;z-index:99;display:none;background:rgba(0,0,0,.8);padding:4px;border-radius:4px}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="err"></div>
<script>
"use strict";
window.onerror=function(m,s,l,c,e){var d=document.getElementById("err");if(d){d.style.display="block";d.textContent="ERR:"+m+" @"+l+":"+c}return false};
</script>
<script src="config.js"></script>
<script src="creatures.js"></script>
<script src="moves.js"></script>
<script src="pixelart.js"></script>
<script src="world.js"></script>
<script src="battle.js"></script>
<script src="renderer.js"></script>
<script src="main.js"></script>
</body>
</html>
